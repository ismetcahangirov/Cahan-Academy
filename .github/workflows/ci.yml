name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'redesign/**' ]

# CI only builds and tests. It never touches production: no production secrets are exposed to
# these steps and database migrations are NOT run here (see docs/DEPLOYMENT.md, "Migrations").
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: API Typecheck
        run: npm run typecheck --workspace=@academy/api

      - name: Backend Tests
        run: npm run test --workspace=@academy/api
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          TEST_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: cahan_academy_test_secret_32_chars_long
          JWT_REFRESH_SECRET: cahan_academy_test_refresh_32_chars_long
          SMTP_USER: test@example.com
          SMTP_PASS: testpassword
          ADMIN_EMAIL: admin@example.com
          NOTIFICATION_EMAIL: notify@example.com
          REVALIDATE_SECRET: test_revalidate_secret

      - name: Frontend Build
        run: npm run build --workspace=@academy/web
