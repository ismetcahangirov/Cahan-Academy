name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Backend Tests
        run: npm run test --workspace=@academy/api
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          TEST_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: cahan_academy_test_secret_32_chars_long
          JWT_REFRESH_SECRET: cahan_academy_test_refresh_32_chars_long
          SMTP_USER: test@example.com
          SMTP_PASS: testpassword
          ADMIN_EMAIL: admin@example.com
          NOTIFICATION_EMAIL: notify@example.com
          REVALIDATE_SECRET: test_revalidate_secret

      - name: Frontend Build
        run: npm run build --workspace=@academy/web

      - name: Run Migrations (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run db:migrate --workspace=@academy/api
